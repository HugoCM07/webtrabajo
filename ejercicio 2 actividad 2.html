<!DOCTYPE html>
<html>
<head>
    <style>
        h1 {
            font-size: 18px;
            margin: 0 0 12px 0;
            font-weight: bold;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            border: 2px solid blue;
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }

        header {
            text-align: left;
        }

        nav {
            display: inline-flex;
            gap: 10px;
            background: #8b5a2b;
            padding: 10px 20px;
            border-radius: 8px;
            justify-content: flex-start;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 12px;
        }

        .menu-vertical {
            display: inline-block;
            margin-top: 20px;
            margin-left: 0;
            text-align: left;
        }

        .menu-vertical a {
            display: block;
            background: #2e8b57;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 4px;
            margin: 6px 0;
            width: 100px;
        }

        .menu-vertical .opcion-roja {
            background: red;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>lista no ordenada -> menu horizontal</h1>
            <nav>
                <a href="ejercicio 1 actividad 2.html">opcion1</a>
                <a href="ejercicio 1 actividad 2.html">opcion2</a>
                <a href="ejercicio 1 actividad 2.html">opcion3</a>
                <a href="ejercicio 1 actividad 2.html">opcion4</a>
                <a href="ejercicio 1 actividad 2.html">opcion5</a>
            </nav>

            <h1>lista ordenada -> menu vertical</h1>

            <div class="menu-vertical">
                <a href="ejercicio 1 actividad 2.html">opcion1</a>
                <a href="ejercicio 1 actividad 2.html">opcion2</a>
                <a class="opcion-roja" href="ejercicio 1 actividad 2.html">opcion3</a>
                <a href="ejercicio 1 actividad 2.html">opcion4</a>
                <a href="ejercicio 1 actividad 2.html">opcion5</a>
            </div>
        </header>
    </div>
</body>
</html>
