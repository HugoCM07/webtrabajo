<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloques de texto sobre una imagen</title>
    <link rel="stylesheet" href="../css/ejercicio 3 actividad 2.css" />
  </head>
  <body class="pagina">
    <header class="encabezado-pagina">
      <p class="etiqueta">Práctica de HTML y CSS</p>
      <h1>Bloques de texto sobre una imagen</h1>
    </header>

    <main class="contenido-principal">
      <iframe
        class="actividad"
        title="Ejemplo de bloques de texto superpuestos sobre una imagen de mandos de videojuegos"
        srcdoc="
          <!DOCTYPE html>
          <html lang='es'>
            <head>
              <meta charset='UTF-8'>
              <meta name='viewport' content='width=device-width, initial-scale=1.0'>
              <title>Bloques sobre una imagen</title>
              <link rel='stylesheet' href='../css/ejercicio 3 actividad 2.css'>
            </head>
            <body class='contenido-iframe'>
              <main class='escena'>
                <img
                  class='imagen-fondo'
                  src='../css/otros/game-controller-collection-vector-flat-260nw-2509538243.webp'
                  alt='Colección de mandos de videojuegos'
                >

                <section class='bloque bloque-superior' aria-labelledby='titulo-bloque'>
                  <h2 id='titulo-bloque'>Bloque div</h2>
                  <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec aliquam tempor diam et accumsan. Vestibulum varius, sapien ut dignissim interdum, lorem risus lacinia enim, in mattis enim urna et sem. Suspendisse ligula lorem, egestas finibus tellus sit amet, finibus posuere tellus. Mauris tempus dictum consequat. Etiam eu dapibus ante. Sed at eros at sapien porttitor interdum nec nec leo. Donec quis venenatis nisl. Nulla eget nunc nisl. Sed suscipit metus eget orci aliquam lacinia ac id urna.
                  </p>
                  <p>
                    Sed non feugiat lorem. Praesent porttitor risus in consequat sagittis. Maecenas ut magna interdum, euismod eros quis, blandit neque. Ut rhoncus, magna eget tincidunt pellentesque.
                  </p>
                </section>

                <section class='bloque bloque-inferior' aria-label='Segundo bloque de texto'>
                  <p>
                    Lorem ipsum dolor sit amet,
                    <span class='resaltado'>consectetur adipiscing elit.</span>
                    <span class='marcado'>Vivamus nec libero dignissim</span>,
                    consequat ex at, placerat velit. In accumsan ornare leo,
                    <em class='cita'>eget pulvinar nunc accumsan sed. Vestibulum dictum ante vel orci commodo posuere eu ultrices nisi.</em>
                    Praesent sed venenatis ligula. Aenean ac congue sem, sit amet tincidunt sem. Nullam magna sapien, consequat in euismod et, volutpat vel lacus. Sed in pellentesque nunc. Praesent ullamcorper purus ut mollis semper. Aenean bibendum eros ut tellus pretium dignissim.
                  </p>
                </section>
              </main>
            </body>
          </html>
        "
      ></iframe>
    </main>

    <footer class="pie-pagina">
      <p>Ejercicio de HTML y CSS</p>
    </footer>
  </body>
</html>
